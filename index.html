<style>
*{margin:0;padding:0;box-sizing:border-box;}

/* ===== 左侧固定竖排长条侧栏 ===== */
.side-bar{
    position:fixed;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:16px;
    z-index:100;
}
.side-btn{
    display:flex;
    align-items:center;
    gap:12px;
    width:220px;
    padding:14px 20px;
    border:none;
    border-radius:20px;
    text-decoration:none;
    color:#ffffff;
    font-size:18px;
    letter-spacing:1px;
    font-family:var(--font-serif);
    box-shadow:0 4px 12px rgba(230,150,170,0.45);
    transition:transform .15s ease, opacity .15s ease, filter .15s ease;
}
.side-btn:hover{ filter:brightness(1.08); }
.side-btn:active{
    transform:scale(0.97);
    opacity:0.88;
}
.side-btn img{
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #ffffff;
    background:#ffd2dc;
    flex-shrink:0;
}
/* 四个按钮：四种渐变色 */
.ks-btn{ background:linear-gradient(135deg,#ff9a8b,#ff6f91); }
.qq-btn{ background:linear-gradient(135deg,#4fc3f7,#0288d1); }   /* 蓝色：浅蓝→深蓝 */
.qg-btn{ background:linear-gradient(135deg,#c09bff,#7b4ff0); }
.home-btn{ background:linear-gradient(135deg,#e879f9,#a855f7); }  /* 紫色：亮紫→紫 */
@media(max-width:768px){
    .side-bar{
        position:static;
        transform:none;
        flex-direction:row;
        margin-bottom:20px;
    }
    .side-btn{ width:auto; flex:1; padding:12px 16px; font-size:16px; }
    .side-btn img{ width:34px; height:34px; }
}

/* ===== 樱花树枝（四个角落） ===== */
.sakura-branch{
    position:fixed;
    z-index:0;
    pointer-events:none;
    opacity:0.85;
}
.branch-tl{ top:-30px; left:-30px; transform:rotate(0deg); }
.branch-tr{ top:-30px; right:-30px; transform:scaleX(-1) rotate(8deg); }
.branch-bl{ bottom:-40px; left:-40px; transform:scaleY(-1) rotate(6deg); }
.branch-br{ bottom:-40px; right:-40px; transform:scale(-1,-1) rotate(-4deg); }

/* ===== 樱花 / 桃花花瓣飘落 ===== */
.petal{
    position:fixed;
    top:-60px;
    z-index:9998;
    pointer-events:none;
    will-change:transform, top, left, opacity;
    filter:drop-shadow(0 2px 3px rgba(200,120,150,0.35));
}
@keyframes sway{
    0%  { transform:translateX(0)    rotate(0deg); }
    25% { transform:translateX(18px)  rotate(90deg); }
    50% { transform:translateX(-12px) rotate(180deg); }
    75% { transform:translateX(14px)  rotate(270deg); }
    100%{ transform:translateX(0)    rotate(360deg); }
}

/* ===== 字体族 ===== */
:root{
    --font-serif: STKaiti, KaiTi, SimSun, serif;
}

body{
    min-height:100vh;
    background:linear-gradient(160deg,#fbd9e0 0%,#f6c6d6 45%,#eec6e6 100%);
    font-family:var(--font-serif);
    padding:20px 16px 20px 260px;
}
.page-title{
    text-align:center;
    font-size:22px;
    color:#44222b;
    margin-bottom:20px;
    letter-spacing:2px;
    font-family:var(--font-serif);
}
@media(max-width:768px){
    body{ padding:20px 16px; }
}
.heart{

    z-index:9999;
    color:#ff88a2;
    font-size:24px;
    pointer-events:none;
}
.wrap{

.top-card{
    background:linear-gradient(160deg,#fff2f5,#ffe6ee);

.avatar-wrap{

.avatar-wrap img{

h1{

.short-line{

.desc{

footer{

    margin-top:32px;
    color:#c0788c;
    font-size:16px;
    font-family:var(--font-serif);
}
</style>

<script>
// JS原生驱动爱心飘落
function createHeart(){
    const h = document.createElement('div');
    h.className = 'heart';
    h.innerText = '♥';
    let x = Math.random() * window.innerWidth;
    let y = -40;
    let speedY = 1.2 + Math.random()*2.2;
    let rotate = 0;
    let rotateSpeed = (Math.random()-0.5)*4;
    h.style.left = x + 'px';
    h.style.top = y + 'px';
    h.style.opacity = 0.55;
    document.body.appendChild(h);

    function tick(){
        y += speedY;
        rotate += rotateSpeed;
        h.style.top = y + 'px';
        h.style.transform = `rotate(${rotate}deg)`;
        if(y < window.innerHeight + 60){
            requestAnimationFrame(tick);
        }else{
            h.remove();
        }
    }
    requestAnimationFrame(tick);
}

// ===== QQ联系点击逻辑 =====
// TODO: 把这里的 QQ号 替换成你自己的QQ号
var MY_QQ_NUMBER = '你的QQ号';
var QQ_PAGE_URL = 'https://qm.qq.com/q/UY0AyskRau';

function isMobile(){
    return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
        || (navigator.maxTouchPoints && navigator.maxTouchPoints > 2 && /Mobile/i.test(navigator.userAgent));
}

function openQQ(){
    if(!MY_QQ_NUMBER || MY_QQ_NUMBER === '你的QQ号') return;
    var ua = navigator.userAgent || '';
    var isIos = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);
    if(isIos || isAndroid){
        window.location.href = 'mqq://im/chat?chat_type=wpa&version=1&src_type=web&uin=' + MY_QQ_NUMBER;
    }else{
        window.open('https://wpa.qq.com/msgrd?v=3&uin=' + MY_QQ_NUMBER + '&site=qq&menu=yes', '_blank', 'noopener');
    }
}

function handleQQContact(e){
    if(isMobile()){
        // 手机端：先打开浏览器跳转页面，延迟后再尝试唤起QQ
        e.preventDefault();
        window.location.href = QQ_PAGE_URL;
        setTimeout(openQQ, 1500);
    }else{
        e.preventDefault();
        window.open(QQ_PAGE_URL, '_blank', 'noopener');
        setTimeout(openQQ, 300);
    }
}

for(let i=0;i<3;i++){
    setTimeout(createHeart, i*600);
}
setInterval(createHeart, 1200);
</script>
